syntax = "proto3";
package kratos.api;

option go_package = "comment-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Registry registry = 3;
  Elasticsearch elasticsearch =4 ;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    TLS tls = 4;
  }
  message TLS {
    bool enabled = 1;
    string ca_file = 2;
    string cert_file = 3;
    string key_file = 4;
    repeated string allowed_clients = 5;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string pass = 3;
    google.protobuf.Duration read_timeout = 4;
    google.protobuf.Duration write_timeout = 5;
  }
  Database database = 1;
  Redis redis = 2;
}
message Registry{
  message Consul{
    string address = 1;
    string scheme = 2;
  }
  Consul consul = 1;
}
message Elasticsearch{
  repeated string addresses = 1;
}
