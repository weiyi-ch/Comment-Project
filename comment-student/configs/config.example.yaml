server:
  http:
    addr: 0.0.0.0:8081
    timeout: 3s
registry:
  consul:
    address: 127.0.0.1:8500
    scheme: http
client:
  comment_service:
    service_name: comment-service
    timeout: 2s
    tls:
      enabled: false
      ca_file: ../certs/mtls/ca.crt
      cert_file: ../certs/mtls/comment-student.crt
      key_file: ../certs/mtls/comment-student.key
      server_name: comment-service
auth:
  role: student
  signing_secret: comment-student-dev-secret
rate_limit:
  enabled: true
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0
    dial_timeout: 1s
    read_timeout: 1s
    write_timeout: 1s
  user:
    rate: 2
    capacity: 5
  ip:
    rate: 20
    capacity: 50
  device:
    rate: 3
    capacity: 10
  api:
    rate: 1000
    capacity: 2000
