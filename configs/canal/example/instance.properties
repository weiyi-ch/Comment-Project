#################################################
# Canal instance config.
# Source: MySQL container `comment-mysql`
# Route:
#   comment.post          -> Kafka topic `post`
#   comment.study_comment -> Kafka topic `comment`
#################################################

canal.instance.mysql.slaveId = 1234
canal.instance.gtidon = false

canal.instance.master.address = mysql:3306
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =
canal.instance.master.gtid =

canal.instance.dbUsername = canal
canal.instance.dbPassword = canal
canal.instance.connectionCharset = UTF-8
canal.instance.defaultDatabaseName = comment
canal.instance.tsdb.enable = true

# 只监听当前代码真正支持同步到 ES 的两张表。
canal.instance.filter.regex = comment\\.post,comment\\.study_comment
canal.instance.filter.black.regex =

# dynamicTopic 把不同表路由到不同 Kafka topic，消费端再用同一个 group 消费 post/comment 两个 topic。
canal.mq.topic = default-binlog
canal.mq.dynamicTopic = post:comment\\.post,comment:comment\\.study_comment
canal.mq.partition = 0
